name: Verify and Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: cabrush-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify wrapper and toolchain
        run: ./gradlew --version

      - name: AVS truth, unit tests, Android lint, and debug APK
        run: ./gradlew --no-daemon --stacktrace :app:vssVerify :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload AVS VSS dump and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CABrush-AVS-0.1.1-Surface-Truth-VSS
          path: app/build/vss/report/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CABrush-Android-Lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CABrush-AVS-0.1.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
