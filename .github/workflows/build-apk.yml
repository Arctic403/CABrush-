name: Verify and Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: cabrush-main-avs-verify
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: AVS Surface Truth verification + APK build
        run: gradle assembleDebug

      - name: Upload AVS VSS dump and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CABrush-AVS-0.1.1-Surface-Truth-VSS
          path: app/build/vss/report/**
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: CABrush-AVS-0.1.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
