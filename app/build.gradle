plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fallpoint.pocketsculpt'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fallpoint.pocketsculpt'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '0.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Core 0.3 VSS compiles the exact dependency-free mesh/sculpt kernel used by
// Android. app:preBuild depends on vssVerify, so no APK can be produced from a
// kernel that fails topology, BVH, rollback, snapshot, render-chunk, scale or
// deterministic-replay verification.
def vssClassesDir = layout.buildDirectory.dir('vss/classes')
def vssReportDir = layout.buildDirectory.dir('vss/report')

tasks.register('vssCompile', JavaCompile) {
    source = files(
            'src/main/java/com/fallpoint/pocketsculpt/BrushMode.java',
            'src/main/java/com/fallpoint/pocketsculpt/PrimitiveLongIntMap.java',
            'src/main/java/com/fallpoint/pocketsculpt/MeshKernel.java',
            'src/main/java/com/fallpoint/pocketsculpt/MeshSnapshot.java',
            'src/main/java/com/fallpoint/pocketsculpt/GeometryValidator.java',
            'src/main/java/com/fallpoint/pocketsculpt/GeometryTransaction.java',
            'src/main/java/com/fallpoint/pocketsculpt/GeometryOps.java',
            'src/main/java/com/fallpoint/pocketsculpt/SculptBvh.java',
            'src/main/java/com/fallpoint/pocketsculpt/StrokeContext.java',
            'src/main/java/com/fallpoint/pocketsculpt/RenderChunkBuilder.java',
            'src/main/java/com/fallpoint/pocketsculpt/SculptEngine.java',
            'src/main/java/com/fallpoint/pocketsculpt/SculptMesh.java',
            '../tools/VssVerify.java'
    )
    classpath = files()
    destinationDirectory.set(vssClassesDir)
    options.encoding = 'UTF-8'
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

tasks.register('vssVerify', JavaExec) {
    dependsOn 'vssCompile'
    classpath = files(vssClassesDir)
    mainClass.set('com.fallpoint.pocketsculpt.VssVerify')
    args(vssReportDir.get().asFile.absolutePath)
    jvmArgs '-Djava.awt.headless=true', '-Xmx1400m'
}

tasks.named('preBuild').configure {
    dependsOn 'vssVerify'
}
